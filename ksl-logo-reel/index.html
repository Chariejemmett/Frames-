<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"color-blue","type":"color","label":"Light blue","default":"#6FBFE5"},
    {"id":"color-navy","type":"color","label":"Navy","default":"#0D1D27"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground, #ffffff); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.3" data-width="1920" data-height="1080"
      data-fps="60" data-motion-blur="on" data-motion-blur-shutter="420">
      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html" data-start="0" data-duration="6.3"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- sound effects from the HyperFrames bundle (Pixabay licence), each placed one frame after its picture -->
      <audio id="sfx-k-whip" class="clip" data-start="0" data-duration="0.57" data-track-index="2" data-volume="0.9" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-k-tap-1" class="clip" data-start="0.4" data-duration="0.227" data-track-index="3" data-volume="0.45" data-playback-rate="1.1" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-k-tap-2" class="clip" data-start="0.716" data-duration="0.278" data-track-index="2" data-volume="0.6" data-playback-rate="0.9" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-leg-pop" class="clip" data-start="0.868" data-duration="0.273" data-track-index="3" data-volume="0.6" data-playback-rate="1.1" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-toss" class="clip" data-start="1.382" data-duration="0.475" data-track-index="2" data-volume="0.6" data-playback-rate="1.2" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-k-land" class="clip" data-start="1.964" data-duration="0.25" data-track-index="2" data-volume="0.7" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-k-land-thump" class="clip" data-start="1.988" data-duration="0.4" data-track-index="3" data-volume="0.16" data-fade-out="0.3" src="assets/sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-slide" class="clip" data-start="2.264" data-duration="0.712" data-track-index="2" data-volume="0.35" data-playback-rate="0.8" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-s-pop" class="clip" data-start="2.257" data-duration="0.3" data-track-index="4" data-volume="0.6" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-l-pop" class="clip" data-start="2.492" data-duration="0.261" data-track-index="3" data-volume="0.6" data-playback-rate="1.15" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-leg-fall" class="clip" data-start="3.192" data-duration="0.438" data-track-index="2" data-volume="0.5" data-playback-rate="1.3" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-leg-hit" class="clip" data-start="3.294" data-duration="0.25" data-track-index="3" data-volume="0.8" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-leg-hit-thump" class="clip" data-start="3.318" data-duration="0.6" data-track-index="4" data-volume="0.2" data-fade-out="0.45" src="assets/sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-leg-swing" class="clip" data-start="3.389" data-duration="0.518" data-track-index="5" data-volume="0.5" data-playback-rate="1.1" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-tagline" class="clip" data-start="4.164" data-duration="0.712" data-track-index="2" data-volume="0.35" data-playback-rate="0.8" src="assets/sfx/whoosh-short.mp3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
