<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"color-blue","type":"color","label":"Light blue","default":"#6FBFE5"},
    {"id":"color-navy","type":"color","label":"Navy","default":"#0D1D27"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground, #ffffff); }

      <audio id="sfx-leg" class="clip" data-start="1.414" data-duration="0.712" data-track-index="3" data-volume="0.25" data-playback-rate="0.8" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-shine" class="clip" data-start="2.39" data-duration="1.8" data-track-index="2" data-volume="0.45" src="assets/sfx/sparkle.mp3"></audio>
      <audio id="sfx-tagline" class="clip" data-start="3.301" data-duration="0.76" data-track-index="3" data-volume="0.35" data-playback-rate="0.75" src="assets/sfx/whoosh-short.mp3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
