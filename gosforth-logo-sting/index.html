<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#FFFFFF"},
    {"id":"color-ink","type":"color","label":"Wordmark","default":"#0E0E0E"},
    {"id":"color-accent","type":"color","label":"Mark red","default":"#F03535"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground, #ffffff);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.4"
      data-width="1920"
      data-height="1080"
      data-fps="60"
      data-motion-blur="on"
      data-motion-blur-shutter="480"
    >
      <div
        id="sting"
        data-composition-id="sting"
        data-composition-src="compositions/sting.html"
        data-start="0"
        data-duration="6.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio id="sfx-whip-in" class="clip" data-start="0.0" data-track-index="2" data-duration="0.42" data-volume="1.05" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-land-1" class="clip" data-start="0.564" data-track-index="2" data-duration="0.24" data-volume="0.9" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-dot-appear" class="clip" data-start="0.812" data-track-index="2" data-duration="0.278" data-volume="0.825" data-playback-rate="1.15" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-launch" class="clip" data-start="0.947" data-track-index="3" data-duration="0.336" data-volume="0.6" data-playback-rate="1.25" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-land-2" class="clip" data-start="1.496" data-track-index="2" data-duration="0.267" data-volume="1.05" data-playback-rate="0.9" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-word-gosforth" class="clip" data-start="2.483" data-track-index="2" data-duration="0.33" data-volume="1.6" src="assets/sfx/woosh-reference.wav"></audio>
      <audio id="sfx-word-roofing" class="clip" data-start="2.908" data-track-index="3" data-duration="0.311" data-volume="1.5" data-playback-rate="1.06" src="assets/sfx/woosh-reference.wav"></audio>
      <audio id="sfx-dot-hit" class="clip" data-start="3.803" data-track-index="2" data-duration="0.209" data-volume="1.125" data-playback-rate="1.15" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-dot-home" class="clip" data-start="4.277" data-track-index="2" data-duration="0.32" data-volume="1.2" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-whip-out" class="clip" data-start="5.926" data-track-index="2" data-duration="0.442" data-volume="1.125" data-playback-rate="0.95" src="assets/sfx/whoosh.mp3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
