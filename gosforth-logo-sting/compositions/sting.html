  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const SLIDE = 583.8; // lockup x offset (px) that puts the mark at frame centre
      const K = 1.2; // logo units to px
      // Every tween states its start values; immediateRender:false keeps later tweens from
      // writing their start state at build time, so any frame can be seeked on its own.
      const ft = (target, from, to, at) =>
        tl.fromTo(target, from, { ...to, immediateRender: false }, at);

      const letters = gsap.utils.toArray("#sting-root .letter");

      // ---- initial state (t = 0): set before the timeline, so frame 0 shows it
      gsap.set("#sting-camera", { scale: 2.4 });
      gsap.set("#sting-lockup", { x: SLIDE });
      gsap.set("#sting-mark", { x: -640 });
      gsap.set(["#sting-slashes", "#sting-rock-front", "#sting-rock-back"], { rotation: 0, y: 0 });
      gsap.set("#sting-squash", { scaleX: 1.35, scaleY: 0.8 });
      gsap.set("#sting-dot", { x: 0, y: 0, scale: 0 });
      gsap.set("#sting-dot-squash", { scaleX: 1, scaleY: 1 });
      gsap.set(letters, { scaleX: 0.4, scaleY: 0, y: 14, x: 0 });

      // ---- 1. whip in from the left, brake, tip onto the front corner, drop back (0.00-0.86)
      ft("#sting-mark", { x: -640 }, { x: 16, duration: 0.42, ease: "expo.out" }, 0);
      ft("#sting-mark", { x: 16 }, { x: 0, duration: 0.4, ease: "power2.inOut" }, 0.42);
      ft("#sting-squash", { scaleX: 1.35, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "power2.out" }, 0.26);
      ft("#sting-rock-front", { rotation: 0 }, { rotation: 13, duration: 0.18, ease: "power2.out" }, 0.26);
      ft("#sting-rock-front", { rotation: 13 }, { rotation: 0, duration: 0.18, ease: "power2.in" }, 0.44);
      // impact at 0.62: squash on the base, then a small rock back onto the rear corner
      ft("#sting-squash", { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.9, duration: 0.05, ease: "power2.out" }, 0.62);
      ft("#sting-squash", { scaleX: 1.07, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.22, ease: "power2.out" }, 0.67);
      ft("#sting-rock-back", { rotation: 0 }, { rotation: -4, duration: 0.11, ease: "power2.out" }, 0.62);
      ft("#sting-rock-back", { rotation: -4 }, { rotation: 0, duration: 0.13, ease: "power2.in" }, 0.73);

      // ---- 2. the dot pops into being; the mark crouches, jumps, flips a half turn (0.84-1.56)
      ft("#sting-dot", { scale: 0 }, { scale: 1, duration: 0.16, ease: "back.out(3)" }, 0.84);
      ft("#sting-squash", { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.84, duration: 0.12, ease: "power2.out" }, 0.9);
      ft("#sting-dot-squash", { scaleX: 1, scaleY: 1 }, { scaleX: 1.2, scaleY: 0.75, duration: 0.12, ease: "power2.out" }, 0.9);
      // launch at 1.02
      ft("#sting-squash", { scaleX: 1.1, scaleY: 0.84 }, { scaleX: 0.92, scaleY: 1.12, duration: 0.1, ease: "power2.out" }, 1.02);
      ft("#sting-squash", { scaleX: 0.92, scaleY: 1.12 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "power1.out" }, 1.12);
      ft("#sting-slashes", { y: 0 }, { y: -110, duration: 0.28, ease: "power2.out" }, 1.02);
      ft("#sting-slashes", { y: -110 }, { y: 0, duration: 0.26, ease: "power2.in" }, 1.3);
      // a half turn lands the two slashes on each other's places: the mark looks identical
      ft("#sting-slashes", { rotation: 0 }, { rotation: 180, duration: 0.54, ease: "power1.inOut" }, 1.02);
      tl.set("#sting-slashes", { rotation: 0 }, 1.56);
      // the dot is fired straight up and out of frame
      ft("#sting-dot-squash", { scaleX: 1.2, scaleY: 0.75 }, { scaleX: 0.8, scaleY: 1.3, duration: 0.08, ease: "power2.out" }, 1.02);
      ft("#sting-dot-squash", { scaleX: 0.8, scaleY: 1.3 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "power1.out" }, 1.1);
      ft("#sting-dot", { y: 0 }, { y: -960, duration: 0.5, ease: "power2.out" }, 1.02);
      // landing at 1.56
      ft("#sting-squash", { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.88, duration: 0.05, ease: "power2.out" }, 1.56);
      ft("#sting-squash", { scaleX: 1.08, scaleY: 0.88 }, { scaleX: 1, scaleY: 1, duration: 0.45, ease: "elastic.out(1, 0.45)" }, 1.61);

      // ---- 3. it leans back, looking up after the dot (1.72-2.40)
      ft("#sting-rock-back", { rotation: 0 }, { rotation: -9, duration: 0.3, ease: "power2.out" }, 1.72);
      ft("#sting-rock-back", { rotation: -9 }, { rotation: 0, duration: 0.3, ease: "power2.inOut" }, 2.18);

      // ---- 4. camera pulls back; the lockup slides to centre; the letters grow out of the baseline
      ft("#sting-camera", { scale: 2.4 }, { scale: 1, duration: 1.15, ease: "power3.inOut" }, 2.2);
      ft("#sting-lockup", { x: SLIDE }, { x: 0, duration: 1.15, ease: "power3.inOut" }, 2.25);
      const LETTER_AT = [2.5, 2.55, 2.59, 2.65, 2.69, 2.74, 2.77, 2.83, 2.92, 2.96, 3.01, 3.07, 3.1, 3.15, 3.2];
      letters.forEach((el, i) => {
        ft(el, { scaleX: 0.4, scaleY: 0, y: 14 }, { scaleX: 1, scaleY: 1, y: 0, duration: 0.34, ease: "back.out(2.4)" }, LETTER_AT[i]);
      });
