<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#1C1C1C"},
    {"id":"color-ink","type":"color","label":"Logo","default":"#FFFFFF"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground, #1c1c1c); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.7"
      data-width="1920"
      data-height="1080"
      data-fps="60"
      data-motion-blur="on"
      data-motion-blur-shutter="360"
      data-motion-blur-events="on"
    >
      <div
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="0"
        data-duration="9.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- the reference animation's own soundtrack: the whole supplied screen recording, 0-9.70 s -->
      <audio id="soundtrack" class="clip" data-start="0" data-duration="9.7" data-track-index="2" data-volume="1" src="assets/audio/reference-soundtrack.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
