  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const ft = (target, from, to, at) => tl.fromTo(target, from, { ...to, immediateRender: false }, at);
      const letters = gsap.utils.toArray("#cg-root .letter");
      const small = ["#cg-s-g1", "#cg-s-g2", "#cg-s-g3"];
      const big = ["#cg-b-g1", "#cg-b-g2", "#cg-b-g3"];

      const A2 = 4.2; // act 2 (the Fiverr-style build) starts on the drop, where the reference's clean pass starts
      // the soundtrack repeats two bars (5.199-7.318 s) so the text loads one letter per beat;
      // everything after the text keeps its original hits, shifted by those two bars
      const BEAT = 0.26483, B0 = 5.199, SHIFT = 8 * BEAT;
      const beat = (k) => B0 + k * BEAT;
      const S2 = A2 + SHIFT;

      // ---- the small dot: one pure function of time drives its path, squash and trail
      const HOME = [976.0, 584.5];
      const BASE = 585 - 15.5;  // dot centre resting on the baseline
      // [t0, t1, from, to, arc height (px, 0 = a fall)]
      // gaps between the letters of CHARLIE (x of the dot's centre as each letter grows up behind it)
      const GAP = [384, 476, 577, 664, 740, 781, 891];
      // [t0, t1, from, to, arc height (px)]
      const HOPS = [
        [4.28, beat(0), HOME, [GAP[0], BASE], 380],  // out of the G's slot, one long arc left to where the bouncing starts
        ...GAP.slice(1).map((x, k) => [beat(k), beat(k + 1), [GAP[k], BASE], [x, BASE], 70]),  // one hop per beat, one letter per hop
        [beat(6), beat(8), [GAP[6], BASE], HOME, 150],  // two beats: a high hop back into the G
        [S2 + 2.20, S2 + 2.55, HOME, [2060, 330], 200],
      ];
      const TOUCH = [4.28, ...GAP.map((_, k) => beat(k)), beat(8)];
      function dotAt(t) {
        if (t < HOPS[0][0]) return HOPS[0][2];
        let last = HOPS[0][2];
        for (const [t0, t1, a, b, h] of HOPS) {
          if (t < t0) return last;
          if (t <= t1) {
            const u = (t - t0) / (t1 - t0);
            const x = a[0] + (b[0] - a[0]) * u;
            const y = h === 0 ? a[1] + (b[1] - a[1]) * u * u : a[1] + (b[1] - a[1]) * u - h * 4 * u * (1 - u);
            return [x, y];
          }
          last = b;
        }
        return last;
      }
      const dotEl = document.querySelector("#cg-dot");
      const squashEl = document.querySelector("#cg-dot-squash");
      const trailEl = document.querySelector("#cg-trail-path");
      function render(t) {
        const [x, y] = dotAt(t);
        gsap.set(dotEl, { x: x - HOME[0], y: y - HOME[1] });
        let s = 0;
        for (const tk of TOUCH) s = Math.max(s, 1 - Math.abs(t - tk) / 0.045);
        gsap.set(squashEl, { scaleX: 1 + 0.3 * s, scaleY: 1 - 0.3 * s });
        // trail: the dot's own path over the last 0.1 s, a little behind it (empty while it is still)
        const pts = [];
        for (let i = 2; i <= 11; i++) { const p = dotAt(t - i * 0.01); pts.push(p[0].toFixed(1) + " " + p[1].toFixed(1)); }
        trailEl.setAttribute("d", "M" + pts.join(" L"));
      }
      const END = 11.81;
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", immediateRender: false, onUpdate: () => render(clock.t) }, 0);

      // ---- initial state (frame 0)
      const hero = ["#cg-h-g1", "#cg-h-g2", "#cg-h-g3"];
      gsap.set(small, { scale: 1, opacity: 0 });
      gsap.set(dotEl, { opacity: 0 });
      gsap.set(letters, { scaleX: 0.5, scaleY: 0, y: 10, opacity: 1 });
      gsap.set("#cg-big", { x: -540 });
      gsap.set(big, { scale: 0 });
      gsap.set("#cg-disc", { x: 0, y: 0, scale: 0 });
      gsap.set("#cg-hero", { x: 0, scale: 1, opacity: 1 });
      gsap.set("#cg-h-g1", { x: -1300, y: 0, rotation: 0 });
      gsap.set("#cg-h-g2", { x: 0, y: -800, rotation: 0 });
      gsap.set("#cg-h-g3", { x: 1300, y: 0, rotation: 0 });
      gsap.set("#cg-h-dot", { x: 0, y: -900, scaleX: 1, scaleY: 1 });
      render(0);

      // ======== ACT 1 (0-4.2 s): over the music's build-up, the icon assembles big at centre ========
      // the dot drops in alone and bounces
      ft("#cg-h-dot", { y: -900 }, { y: 0, duration: 0.3, ease: "power2.in" }, 0.3);
      const dotSquash = (at, amt) => {
        ft("#cg-h-dot", { scaleX: 1, scaleY: 1 }, { scaleX: 1 + amt, scaleY: 1 - amt, duration: 0.05, ease: "power2.out" }, at);
        ft("#cg-h-dot", { scaleX: 1 + amt, scaleY: 1 - amt }, { scaleX: 1, scaleY: 1, duration: 0.25, ease: "elastic.out(1, 0.5)" }, at + 0.05);
      };
      const dotHop = (at, h, dur) => {
        ft("#cg-h-dot", { y: 0 }, { y: -h, duration: dur / 2, ease: "power2.out" }, at);
        ft("#cg-h-dot", { y: -h }, { y: 0, duration: dur / 2, ease: "power2.in" }, at + dur / 2);
        dotSquash(at + dur, 0.25);
      };
      dotSquash(0.6, 0.35);
      dotHop(0.66, 70, 0.3);
      // block 1 slides in from the left and knocks into the dot's corner (1.0)
      ft("#cg-h-g1", { x: -1300 }, { x: 0, duration: 0.3, ease: "power3.out" }, 0.72);
      dotHop(1.0, 55, 0.26);
      // block 2 drops in from the top (1.78)
      ft("#cg-h-g2", { y: -800 }, { y: 0, duration: 0.24, ease: "power2.in" }, 1.54);
      ft("#cg-h-g2", { scaleY: 1 }, { scaleY: 0.88, duration: 0.04, ease: "power2.out" }, 1.78);
      ft("#cg-h-g2", { scaleY: 0.88 }, { scaleY: 1, duration: 0.25, ease: "elastic.out(1, 0.5)" }, 1.82);
      dotHop(1.8, 40, 0.22);
      // block 3 slides in from the right and closes the G (2.12)
      ft("#cg-h-g3", { x: 1300 }, { x: 0, duration: 0.2, ease: "power3.out" }, 1.92);
      // two punches on the next hits
      [2.3, 2.6].forEach((at) => {
        ft("#cg-hero", { scale: 1 }, { scale: 1.05, duration: 0.04, ease: "power2.out" }, at);
        ft("#cg-hero", { scale: 1.05 }, { scale: 1, duration: 0.2, ease: "power2.out" }, at + 0.04);
      });
      // tension: the pieces pull apart as the music builds, then snap back on the drop
      const APART = { "#cg-h-g1": [-46, -34, -4], "#cg-h-g2": [40, -46, 5], "#cg-h-g3": [44, 38, 3], "#cg-h-dot": [-40, 52, 0] };
      Object.entries(APART).forEach(([sel, [dx, dy, r]]) => {
        ft(sel, { x: 0, y: 0, rotation: 0 }, { x: dx, y: dy, rotation: r, duration: 1.1, ease: "power2.inOut" }, 2.75);
        ft(sel, { x: dx, y: dy, rotation: r }, { x: 0, y: 0, rotation: 0, duration: 0.12, ease: "power4.in" }, 3.86);
      });
      // the G, dot included, shrinks into its place in the wordmark; the small dot takes over in the same spot
      ft("#cg-hero", { x: 0, scale: 1 }, { x: 33.5, scale: 0.3663, duration: 0.22, ease: "power3.inOut" }, 3.98);
      tl.set("#cg-hero", { opacity: 0 }, A2);
      tl.set(small, { opacity: 1 }, A2);
      tl.set(dotEl, { opacity: 1 }, A2);

      // ======== ACT 2 (4.2-9.65 s): the Fiverr-style build, on the reference's own hits ========
      // CHARLIE: each letter grows as the dot lands beside it; STUDIO: a cascade at half-beat steps after the dot lands in the G
      const POP = [...GAP.map((_, k) => beat(k) - 0.02), ...[0, 1, 2, 3, 4, 5].map((i) => beat(8) + 0.02 + i * BEAT / 2)];
      letters.forEach((el, i) => ft(el, { scaleX: 0.5, scaleY: 0, y: 10 }, { scaleX: 1, scaleY: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, POP[i]));
      ft(small, { y: 0 }, { y: 5, duration: 0.05, ease: "power2.out" }, beat(8));
      ft(small, { y: 5 }, { y: 0, duration: 0.3, ease: "elastic.out(1, 0.5)" }, beat(8) + 0.05);
      tl.set(dotEl, { opacity: 0 }, S2 + 2.56);
      const DY = -125.0;
      const X_AT = (wx) => wx - (912.0 + -540);
      ft("#cg-disc", { x: X_AT(2120), y: DY, scale: 0.4 }, { x: X_AT(1900), y: DY, scale: 1, duration: 0.2, ease: "power2.out" }, S2 + 2.6);
      ft("#cg-disc", { x: X_AT(1900) }, { x: X_AT(420), duration: 0.15, ease: "power2.in" }, S2 + 2.8);
      const passAt = (cx) => S2 + (cx >= 1900 ? 2.8 : cx <= 420 ? 2.95 : 2.8 + 0.15 * Math.sqrt((1900 - cx) / 1480));
      letters.forEach((el) => tl.set(el, { opacity: 0 }, passAt(+el.dataset.cx)));
      tl.set(small, { opacity: 0 }, passAt(993.5));
      const DOT_S = 0.2588;
      ft("#cg-disc", { x: X_AT(420), y: DY, scale: 1 }, { x: 0, y: 0, scale: DOT_S, duration: 0.17, ease: "power3.inOut" }, S2 + 2.95);
      big.forEach((el, i) => ft(el, { scale: 0.3 }, { scale: 1, duration: 0.3, ease: "back.out(1.7)" }, S2 + 2.95 + i * 0.03));
      ft("#cg-big", { x: -540 }, { x: 0, duration: 0.33, ease: "power3.out" }, S2 + 3.0);

      // ======== ENDING (10.5-11.8 s): the icon punches on the last two beats, as the big G did in act 1, then holds ========
      [[8.40 + SHIFT, 1.05], [8.92 + SHIFT, 1.03]].forEach(([at, k]) => {
        ft("#cg-big", { scale: 1 }, { scale: k, duration: 0.04, ease: "power2.out" }, at);
        ft("#cg-big", { scale: k }, { scale: 1, duration: 0.22, ease: "power2.out" }, at + 0.04);
      });

      window.__timelines["logo"] = tl;
    })();
  </script>
